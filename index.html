<style>

:root {
  --bg-color: #f4f6f9;
  --card-bg: #ffffff;
  --primary: #2563eb;
  --income: #16a34a;
  --expense: #dc2626;
  --text: #1f2937;
  --border: #e5e7eb;
  --muted: #6b7280;
}

* {
  box-sizing: border-box;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

  background: var(--bg-color);
  color: var(--text);

  margin: 0;
  min-height: 100vh;
}


/* =========================
   TOP BAR
========================= */

.top-bar {
  height: 60px;
  background: white;

  border-bottom: 1px solid var(--border);

  display: flex;
  align-items: center;

  padding: 0 20px;

  position: sticky;
  top: 0;

  z-index: 100;
}

.menu-button {
  width: 40px;
  height: 40px;

  border: none;
  background: transparent;

  cursor: pointer;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  gap: 5px;
}

.menu-button span {
  width: 23px;
  height: 2px;

  background: var(--text);

  border-radius: 2px;
}

.page-title {
  margin-left: 14px;

  font-size: 1.1rem;
  font-weight: 700;
}


/* =========================
   SIDE MENU
========================= */

.side-menu {
  position: fixed;

  top: 0;
  left: -280px;

  width: 270px;
  height: 100vh;

  background: white;

  z-index: 200;

  box-shadow:
    4px 0 15px rgba(0,0,0,0.12);

  transition: left 0.25s ease;

  padding-top: 20px;
}

.side-menu.open {
  left: 0;
}

.menu-header {
  padding: 20px;

  font-size: 1.2rem;
  font-weight: 700;

  border-bottom:
    1px solid var(--border);

  margin-bottom: 10px;
}

.menu-item {
  width: 100%;

  padding: 15px 20px;

  border: none;
  background: transparent;

  text-align: left;

  font-size: 1rem;
  color: var(--text);

  cursor: pointer;
}

.menu-item:hover {
  background: #f3f4f6;
}

.menu-item.active {
  background: #eff6ff;

  color: var(--primary);

  font-weight: 600;

  border-right:
    3px solid var(--primary);
}

.menu-overlay {
  position: fixed;
  inset: 0;

  background:
    rgba(0,0,0,0.25);

  z-index: 150;

  display: none;
}

.menu-overlay.show {
  display: block;
}


/* =========================
   APP
========================= */

.app-container {
  width: 100%;
  max-width: 500px;

  margin: 0 auto;

  padding: 20px;
}


/* =========================
   SYNC STATUS
========================= */

.sync-status {
  font-size: 0.75rem;

  color: var(--muted);

  text-align: center;

  height: 18px;

  margin-bottom: 10px;
}

.sync-status.success {
  color: var(--income);
}

.sync-status.error {
  color: var(--expense);
}


/* =========================
   PAGES
========================= */

.page {
  display: none;
}

.page.active {
  display: block;
}


/* =========================
   CARDS
========================= */

.card {
  background: var(--card-bg);

  border-radius: 12px;

  padding: 20px;

  margin-bottom: 16px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.06);

  border:
    1px solid var(--border);
}

h2 {
  margin-top: 0;
  margin-bottom: 15px;

  font-size: 1.1rem;
}


/* =========================
   DASHBOARD
========================= */

.dashboard-grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;
}

.stat-box {
  background: #f8fafc;

  padding: 14px;

  border-radius: 8px;

  border:
    1px solid var(--border);
}

.stat-label {
  font-size: 0.78rem;

  color: var(--muted);

  margin-bottom: 5px;
}

.stat-value {
  font-size: 1.2rem;

  font-weight: 700;
}

.period-info {
  margin-top: 15px;

  padding: 11px;

  background: #eff6ff;

  border:
    1px solid #bfdbfe;

  border-radius: 8px;

  color: #1e40af;

  font-size: 0.85rem;

  text-align: center;
}


/* =========================
   FORMS
========================= */

.form-group {
  display: flex;

  flex-direction: column;

  gap: 8px;

  margin-bottom: 14px;
}

label {
  font-size: 0.85rem;

  font-weight: 600;
}

input[type="text"],
input[type="number"],
input[type="date"],
select {

  width: 100%;

  padding: 11px;

  border:
    1px solid var(--border);

  border-radius: 7px;

  font-size: 1rem;

  background: white;

  color: var(--text);
}

input:focus,
select:focus {

  outline: none;

  border-color:
    var(--primary);
}


/* =========================
   BUTTONS
========================= */

button {
  cursor: pointer;

  font-family: inherit;
}

.btn-group {
  display: flex;

  gap: 8px;
}

.btn {
  flex: 1;

  padding: 11px;

  border: none;

  border-radius: 7px;

  font-size: 0.9rem;

  font-weight: 600;
}

.btn-add {
  background: var(--income);

  color: white;
}

.btn-sub {
  background: var(--expense);

  color: white;
}

.btn-primary {
  background: var(--primary);

  color: white;
}

.btn-secondary {
  background: #e5e7eb;

  color: #374151;
}

.btn-delete {
  background: #fee2e2;

  color: #991b1b;
}


/* =========================
   SIMULATOR
========================= */

.sim-result {
  margin-top: 10px;

  padding: 11px;

  border-radius: 7px;

  font-size: 0.9rem;

  background: #f0fdf4;

  border:
    1px solid #bbf7d0;

  color: #166534;
}

.sim-result.warning {

  background: #fef2f2;

  border-color: #fecaca;

  color: #991b1b;
}


/* =========================
   HISTORY
========================= */

.history-list {
  list-style: none;

  padding: 0;
  margin: 0;
}

.history-item {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  padding: 13px 0;

  border-bottom:
    1px solid var(--border);
}

.history-item:last-child {
  border-bottom: none;
}

.history-left {
  min-width: 0;

  flex: 1;
}

.history-note {
  font-weight: 500;

  word-break: break-word;
}

.history-date {
  font-size: 0.75rem;

  color: #9ca3af;

  margin-top: 3px;
}

.history-right {
  display: flex;

  align-items: center;

  gap: 7px;

  white-space: nowrap;
}

.amount-income {
  color: var(--income);

  font-weight: 600;
}

.amount-expense {
  color: var(--expense);

  font-weight: 600;
}

.btn-edit {

  border: none;

  background: #f3f4f6;

  color: #374151;

  padding:
    6px 9px;

  border-radius: 6px;

  font-size: 0.75rem;

  font-weight: 600;
}


/* =========================
   EDIT BOX
========================= */

.edit-box {

  margin:
    5px 0 10px;

  padding: 14px;

  background: #f8fafc;

  border:
    1px solid var(--border);

  border-radius: 8px;
}

.edit-buttons {

  display: flex;

  gap: 8px;
}

.edit-buttons button {

  flex: 1;

  padding: 9px;

  border: none;

  border-radius: 6px;

  font-size: 0.85rem;

  font-weight: 600;
}

.empty-history {

  text-align: center;

  color: #9ca3af;

  padding: 25px 10px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 400px) {

  .app-container {
    padding: 14px;
  }

  .card {
    padding: 16px;
  }

}

</style>

/* =====================================================
   GLOBAL DATA
===================================================== */

let transactions = [];


/* =====================================================
   LOCAL CACHE
===================================================== */

const CACHE_KEY =
  "budgetTrackerTransactions";


function loadLocalCache() {

  try {

    const saved =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!saved) {
      return;
    }


    const parsed =
      JSON.parse(saved);


    if (
      Array.isArray(parsed)
    ) {

      transactions =
        parsed;

      updateUI();

    }

  } catch (error) {

    console.error(
      "Cache error:",
      error
    );

  }

}


function saveLocalCache() {

  try {

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(
        transactions
      )
    );

  } catch (error) {

    console.error(
      "Cache save error:",
      error
    );

  }

}


/* =====================================================
   STATUS
===================================================== */

function setSyncStatus(
  message,
  type = ""
) {

  const element =
    document.getElementById(
      "syncStatus"
    );


  element.innerText =
    message;


  element.className =
    "sync-status " +
    type;

}


/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

  document
    .getElementById("sideMenu")
    .classList
    .toggle("open");


  document
    .getElementById("menuOverlay")
    .classList
    .toggle("show");

}


function closeMenu() {

  document
    .getElementById("sideMenu")
    .classList
    .remove("open");


  document
    .getElementById("menuOverlay")
    .classList
    .remove("show");

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(page) {

  const dashboard =
    document.getElementById(
      "dashboardPage"
    );


  const history =
    document.getElementById(
      "historyPage"
    );


  const dashboardMenu =
    document.getElementById(
      "dashboardMenu"
    );


  const historyMenu =
    document.getElementById(
      "historyMenu"
    );


  const title =
    document.getElementById(
      "pageTitle"
    );


  dashboard.classList.remove(
    "active"
  );

  history.classList.remove(
    "active"
  );

  dashboardMenu.classList.remove(
    "active"
  );

  historyMenu.classList.remove(
    "active"
  );


  if (
    page === "dashboard"
  ) {

    dashboard.classList.add(
      "active"
    );

    dashboardMenu.classList.add(
      "active"
    );

    title.innerText =
      "Dashboard";

  }


  if (
    page === "history"
  ) {

    history.classList.add(
      "active"
    );

    historyMenu.classList.add(
      "active"
    );

    title.innerText =
      "Transaction History";

  }


  closeMenu();

}


/* =====================================================
   BUDGET PERIOD
===================================================== */

function getBudgetStartDay() {

  const saved =
    parseInt(
      localStorage.getItem(
        "budgetPeriodStart"
      )
    );


  if (
    !isNaN(saved) &&
    saved >= 1 &&
    saved <= 31
  ) {

    return saved;

  }


  return 3;

}


function saveBudgetPeriod() {

  const input =
    document.getElementById(
      "periodStart"
    );


  const day =
    parseInt(
      input.value
    );


  if (
    isNaN(day) ||
    day < 1 ||
    day > 31
  ) {

    alert(
      "Please enter a valid day between 1 and 31."
    );

    return;

  }


  localStorage.setItem(
    "budgetPeriodStart",
    day
  );


  document.getElementById(
    "periodStatus"
  ).innerText =
    `Budget period starts on the ${getOrdinal(day)} of every month.`;


  updateUI();

}


function loadBudgetPeriod() {

  const day =
    getBudgetStartDay();


  document.getElementById(
    "periodStart"
  ).value =
    day;


  document.getElementById(
    "periodStatus"
  ).innerText =
    `Budget period starts on the ${getOrdinal(day)} of every month.`;

}


function getOrdinal(number) {

  if (
    number % 100 >= 11 &&
    number % 100 <= 13
  ) {

    return number + "th";

  }


  switch (
    number % 10
  ) {

    case 1:
      return number + "st";

    case 2:
      return number + "nd";

    case 3:
      return number + "rd";

    default:
      return number + "th";

  }

}


/* =====================================================
   DATE FUNCTIONS
===================================================== */

function createSafeDate(
  year,
  month,
  day
) {

  const lastDay =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const actualDay =
    Math.min(
      day,
      lastDay
    );


  const date =
    new Date(
      year,
      month,
      actualDay
    );


  date.setHours(
    0,
    0,
    0,
    0
  );


  return date;

}


function getCurrentBudgetPeriod() {

  const today =
    new Date();


  today.setHours(
    0,
    0,
    0,
    0
  );


  const startDay =
    getBudgetStartDay();


  let startDate;
  let endDate;


  if (
    today.getDate() >= startDay
  ) {

    startDate =
      createSafeDate(
        today.getFullYear(),
        today.getMonth(),
        startDay
      );


    endDate =
      createSafeDate(
        today.getFullYear(),
        today.getMonth() + 1,
        startDay
      );

  } else {

    startDate =
      createSafeDate(
        today.getFullYear(),
        today.getMonth() - 1,
        startDay
      );


    endDate =
      createSafeDate(
        today.getFullYear(),
        today.getMonth(),
        startDay
      );

  }


  return {
    startDate,
    endDate
  };

}


function getPreviousBudgetPeriod() {

  const current =
    getCurrentBudgetPeriod();


  const startDay =
    getBudgetStartDay();


  const start =
    createSafeDate(
      current.startDate.getFullYear(),
      current.startDate.getMonth() - 1,
      startDay
    );


  return {
    startDate: start,
    endDate: current.startDate
  };

}


function parseTransactionDate(
  value
) {

  if (!value) {
    return null;
  }


  const text =
    String(value)
      .trim();


  const match =
    text.match(
      /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
    );


  if (match) {

    const date =
      new Date(
        parseInt(match[3]),
        parseInt(match[2]) - 1,
        parseInt(match[1])
      );


    date.setHours(
      0,
      0,
      0,
      0
    );


    return date;

  }


  const date =
    new Date(
      text
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return null;

  }


  date.setHours(
    0,
    0,
    0,
    0
  );


  return date;

}


function formatDate(
  date
) {

  return date.toLocaleDateString(
    "en-IN",
    {
      day: "numeric",
      month: "short",
      year: "numeric"
    }
  );

}


/* =====================================================
   CALCULATIONS
===================================================== */

function calculateTotalBalance() {

  return transactions.reduce(
    (
      balance,
      item
    ) => {

      const amount =
        parseFloat(
          item.amount
        ) || 0;


      if (
        item.type === "income"
      ) {

        return balance + amount;

      }


      return balance - amount;

    },
    0
  );

}


function calculatePeriodTotal(
  startDate,
  endDate
) {

  return transactions.reduce(
    (
      total,
      item
    ) => {

      const date =
        parseTransactionDate(
          item.date
        );


      if (
        !date ||
        date < startDate ||
        date >= endDate
      ) {

        return total;

      }


      const amount =
        parseFloat(
          item.amount
        ) || 0;


      return item.type === "income"
        ? total + amount
        : total - amount;

    },
    0
  );

}


function calculateLastMonthSaved() {

  const previous =
    getPreviousBudgetPeriod();


  return calculatePeriodTotal(
    previous.startDate,
    previous.endDate
  );

}


function getDaysRemaining() {

  const today =
    new Date();


  today.setHours(
    0,
    0,
    0,
    0
  );


  const period =
    getCurrentBudgetPeriod();


  const difference =
    period.endDate -
    today;


  return Math.max(
    1,
    Math.ceil(
      difference /
      (
        1000 *
        60 *
        60 *
        24
      )
    ) + 1
  );

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI() {

  const balance =
    calculateTotalBalance();


  const daysLeft =
    getDaysRemaining();


  const daily =
    daysLeft > 0
      ? balance / daysLeft
      : balance;


  const saved =
    calculateLastMonthSaved();


  document.getElementById(
    "totalBalance"
  ).innerText =
    `₹${Math.max(
      0,
      balance
    ).toLocaleString(
      "en-IN",
      {
        maximumFractionDigits: 2
      }
    )}`;


  document.getElementById(
    "daysLeft"
  ).innerText =
    daysLeft;


  document.getElementById(
    "dailySpend"
  ).innerText =
    `₹${Math.max(
      0,
      daily
    ).toFixed(2)}`;


  document.getElementById(
    "lastMonthSaved"
  ).innerText =
    `₹${Math.max(
      0,
      saved
    ).toLocaleString(
      "en-IN",
      {
        maximumFractionDigits: 2
      }
    )}`;


  const period =
    getCurrentBudgetPeriod();


  document.getElementById(
    "periodInfo"
  ).innerText =
    `Current budget period: ${formatDate(
      period.startDate
    )} → ${formatDate(
      period.endDate
    )}`;


  renderTransactionHistory();

}


/* =====================================================
   SUPABASE LOAD
===================================================== */

async function fetchCloudData() {

  setSyncStatus(
    "Syncing...",
    ""
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("transactions")
        .select("*")
        .order(
          "date",
          {
            ascending: false
          }
        )
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      throw error;

    }


    transactions =
      (data || []).map(
        item => ({

          id:
            item.id,

          note:
            item.note,

          amount:
            parseFloat(
              item.amount
            ) || 0,

          type:
            item.type,

          date:
            item.date

        })
      );


    saveLocalCache();


    updateUI();


    setSyncStatus(
      "Synced",
      "success"
    );


    setTimeout(
      () => {

        setSyncStatus(
          "Ready"
        );

      },
      2000
    );


  } catch (error) {

    console.error(
      "Supabase error:",
      error
    );


    setSyncStatus(
      "Could not sync with Supabase",
      "error"
    );

  }

}


/* =====================================================
   ADD TRANSACTION
===================================================== */

async function addTransaction(
  type
) {

  const noteInput =
    document.getElementById(
      "txNote"
    );


  const amountInput =
    document.getElementById(
      "txAmount"
    );


  const note =
    noteInput.value.trim() ||
    (
      type === "income"
        ? "Income"
        : "Expense"
    );


  const amount =
    parseFloat(
      amountInput.value
    );


  if (
    isNaN(amount) ||
    amount <= 0
  ) {

    alert(
      "Please enter a valid amount."
    );

    return;

  }


  const today =
    new Date();


  const year =
    today.getFullYear();


  const month =
    String(
      today.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      today.getDate()
    ).padStart(
      2,
      "0"
    );


  const date =
    `${year}-${month}-${day}`;


  setSyncStatus(
    "Saving...",
    ""
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("transactions")
        .insert([
          {
            note:
              note,

            amount:
              amount,

            type:
              type,

            date:
              date
          }
        ])
        .select()
        .single();


    if (error) {

      throw error;

    }


    transactions.unshift({

      id:
        data.id,

      note:
        data.note,

      amount:
        parseFloat(
          data.amount
        ),

      type:
        data.type,

      date:
        data.date

    });


    saveLocalCache();


    updateUI();


    noteInput.value =
      "";

    amountInput.value =
      "";


    setSyncStatus(
      "Transaction saved",
      "success"
    );


    setTimeout(
      () => {

        setSyncStatus(
          "Ready"
        );

      },
      1500
    );


  } catch (error) {

    console.error(
      "Insert error:",
      error
    );


    setSyncStatus(
      "Failed to save transaction",
      "error"
    );


    alert(
      "Could not save transaction. Check your Supabase connection."
    );

  }

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderTransactionHistory() {

  const list =
    document.getElementById(
      "historyList"
    );


  if (
    transactions.length === 0
  ) {

    list.innerHTML = `

      <li class="empty-history">
        No transactions logged yet.
      </li>

    `;

    return;

  }


  list.innerHTML =
    "";


  transactions.forEach(
    item => {

      const li =
        document.createElement(
          "li"
        );


      li.className =
        "history-item";


      li.dataset.id =
        String(
          item.id
        );


      const sign =
        item.type === "income"
          ? "+"
          : "-";


      const cssClass =
        item.type === "income"
          ? "amount-income"
          : "amount-expense";


      const amount =
        parseFloat(
          item.amount
        ) || 0;


      li.innerHTML = `

        <div class="history-left">

          <div class="history-note">
            ${escapeHtml(
              item.note
            )}
          </div>

          <div class="history-date">
            ${formatHistoryDate(
              item.date
            )}
          </div>

        </div>


        <div class="history-right">

          <div
            class="${cssClass}"
          >
            ${sign}₹${amount.toLocaleString(
              "en-IN"
            )}
          </div>


          <button
            class="btn-edit"
            onclick="editTransaction('${item.id}')"
          >
            Edit
          </button>

        </div>

      `;


      list.appendChild(
        li
      );

    }
  );

}


function formatHistoryDate(
  value
) {

  const date =
    parseTransactionDate(
      value
    );


  if (!date) {

    return value;

  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day: "numeric",
      month: "short",
      year: "numeric"
    }
  );

}


/* =====================================================
   EDIT TRANSACTION
===================================================== */

function editTransaction(
  id
) {

  const transaction =
    transactions.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!transaction) {

    return;

  }


  const existing =
    document.getElementById(
      "edit-" + id
    );


  if (existing) {

    existing.remove();

    return;

  }


  const item =
    document.querySelector(
      `.history-item[data-id="${id}"]`
    );


  if (!item) {

    return;

  }


  const editBox =
    document.createElement(
      "div"
    );


  editBox.className =
    "edit-box";


  editBox.id =
    "edit-" + id;


  const date =
    parseTransactionDate(
      transaction.date
    );


  let dateValue =
    "";


  if (date) {

    dateValue =
      `${date.getFullYear()}-${
        String(
          date.getMonth() + 1
        ).padStart(2, "0")
      }-${
        String(
          date.getDate()
        ).padStart(2, "0")
      }`;

  }


  editBox.innerHTML = `

    <div class="form-group">

      <label>
        Description
      </label>

      <input
        type="text"
        id="editNote-${id}"
        value="${escapeHtml(
          transaction.note
        )}"
      >


      <label>
        Amount
      </label>

      <input
        type="number"
        id="editAmount-${id}"
        value="${transaction.amount}"
        min="0"
      >


      <label>
        Type
      </label>

      <select
        id="editType-${id}"
      >

        <option
          value="income"
          ${
            transaction.type === "income"
              ? "selected"
              : ""
          }
        >
          Income
        </option>


        <option
          value="expense"
          ${
            transaction.type === "expense"
              ? "selected"
              : ""
          }
        >
          Expense
        </option>

      </select>


      <label>
        Date
      </label>

      <input
        type="date"
        id="editDate-${id}"
        value="${dateValue}"
      >

    </div>


    <div class="edit-buttons">

      <button
        class="btn-primary"
        onclick="saveEditedTransaction('${id}')"
      >
        Save Changes
      </button>


      <button
        class="btn-secondary"
        onclick="cancelEdit('${id}')"
      >
        Cancel
      </button>

    </div>

  `;


  item.after(
    editBox
  );

}


/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEditedTransaction(
  id
) {

  const note =
    document.getElementById(
      "editNote-" + id
    ).value.trim();


  const amount =
    parseFloat(
      document.getElementById(
        "editAmount-" + id
      ).value
    );


  const type =
    document.getElementById(
      "editType-" + id
    ).value;


  const date =
    document.getElementById(
      "editDate-" + id
    ).value;


  if (
    !note ||
    isNaN(amount) ||
    amount <= 0 ||
    !date
  ) {

    alert(
      "Please enter all details correctly."
    );

    return;

  }


  setSyncStatus(
    "Updating...",
    ""
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("transactions")
        .update({

          note:
            note,

          amount:
            amount,

          type:
            type,

          date:
            date

        })
        .eq(
          "id",
          id
        )
        .select()
        .single();


    if (error) {

      throw error;

    }


    const index =
      transactions.findIndex(
        item =>
          String(item.id) ===
          String(id)
      );


    if (
      index !== -1
    ) {

      transactions[index] = {

        id:
          data.id,

        note:
          data.note,

        amount:
          parseFloat(
            data.amount
          ),

        type:
          data.type,

        date:
          data.date

      };

    }


    saveLocalCache();


    updateUI();


    setSyncStatus(
      "Transaction updated",
      "success"
    );


    setTimeout(
      () => {

        setSyncStatus(
          "Ready"
        );

      },
      1500
    );


  } catch (error) {

    console.error(
      "Update error:",
      error
    );


    setSyncStatus(
      "Update failed",
      "error"
    );


    alert(
      "Could not update transaction."
    );

  }

}


function cancelEdit(
  id
) {

  const box =
    document.getElementById(
      "edit-" + id
    );


  if (box) {

    box.remove();

  }

}


/* =====================================================
   DELETE TRANSACTION
===================================================== */

async function deleteTransaction(
  id
) {

  const confirmed =
    confirm(
      "Delete this transaction?"
    );


  if (!confirmed) {

    return;

  }


  setSyncStatus(
    "Deleting...",
    ""
  );


  try {

    const {
      error
    } =
      await supabaseClient
        .from("transactions")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      throw error;

    }


    transactions =
      transactions.filter(
        item =>
          String(item.id) !==
          String(id)
      );


    saveLocalCache();


    updateUI();


    setSyncStatus(
      "Transaction deleted",
      "success"
    );


    setTimeout(
      () => {

        setSyncStatus(
          "Ready"
        );

      },
      1500
    );


  } catch (error) {

    console.error(
      "Delete error:",
      error
    );


    setSyncStatus(
      "Delete failed",
      "error"
    );


    alert(
      "Could not delete transaction."
    );

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text || "";


  return div.innerHTML;

}


/* =====================================================
   AFFORDABILITY
===================================================== */

function checkAffordability() {

  const input =
    document.getElementById(
      "simAmount"
    );


  const cost =
    parseFloat(
      input.value
    );


  const result =
    document.getElementById(
      "simResult"
    );


  if (
    isNaN(cost) ||
    cost <= 0
  ) {

    alert(
      "Please enter a valid purchase amount."
    );

    return;

  }


  const balance =
    calculateTotalBalance();


  const days =
    getDaysRemaining();


  const remaining =
    balance - cost;


  result.style.display =
    "block";


  if (
    remaining < 0
  ) {

    result.className =
      "sim-result warning";


    result.innerHTML = `

      <strong>
        Over Budget!
      </strong>

      Buying this will put you
      in a deficit of

      <strong>
        ₹${Math.abs(
          remaining
        ).toLocaleString(
          "en-IN"
        )}
      </strong>.

    `;

  } else {

    const daily =
      (
        remaining /
        days
      ).toFixed(2);


    result.className =
      "sim-result";


    result.innerHTML = `

      You can afford this!

      After spending
      ₹${cost.toLocaleString(
        "en-IN"
      )},

      your daily budget for the next
      ${days} days will be

      <strong>
        ₹${daily} / day
      </strong>.

    `;

  }

}


/* =====================================================
   START APP
===================================================== */

loadBudgetPeriod();

loadLocalCache();

updateUI();


/*
   Load the latest data from
   Supabase after the interface
   has already appeared.
*/

setTimeout(
  () => {

    fetchCloudData();

  },
  50
);


</script>
