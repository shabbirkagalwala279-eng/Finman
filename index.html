<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg-color: #f4f6f9;
  --card-bg: #ffffff;
  --primary: #2563eb;
  --income: #16a34a;
  --expense: #dc2626;
  --text: #1f2937;
  --border: #e5e7eb;
}

* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text);
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}

/* =========================
   TOP BAR
   ========================= */

.top-bar {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 16px auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.menu-button {
  width: 44px;
  height: 44px;
  flex: none;
  background: white;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.menu-button:hover {
  background: #f8fafc;
}

.menu-title {
  font-size: 1.1rem;
  font-weight: 700;
}

/* =========================
   MENU
   ========================= */

.menu {
  display: none;
  position: absolute;
  top: 72px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 40px);
  max-width: 500px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.12);
  overflow: hidden;
  z-index: 1000;
}

.menu.open {
  display: block;
}

.menu-item {
  width: 100%;
  padding: 15px 16px;
  background: white;
  color: var(--text);
  border: none;
  border-bottom: 1px solid var(--border);
  text-align: left;
  font-size: 0.95rem;
  cursor: pointer;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-item:hover {
  background: #f8fafc;
}

.menu-item.active {
  background: #eff6ff;
  color: var(--primary);
  font-weight: 600;
}

/* =========================
   APP
   ========================= */

.app-container {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

h2 {
  margin-top: 0;
  margin-bottom: 12px;
  font-size: 1.1rem;
}

/* =========================
   DASHBOARD
   ========================= */

.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 10px;
}

.stat-box {
  background: #f8fafc;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.stat-label {
  font-size: 0.8rem;
  color: #6b7280;
  margin-bottom: 4px;
}

.stat-value {
  font-size: 1.25rem;
  font-weight: 700;
}

/* =========================
   FORM
   ========================= */

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

input[type="text"],
input[type="number"],
input[type="date"] {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 1rem;
  background: white;
}

input:focus {
  outline: none;
  border-color: var(--primary);
}

.period-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn-group {
  display: flex;
  gap: 8px;
}

button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 6px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}

.btn-add {
  background: var(--income);
  color: white;
}

.btn-sub {
  background: var(--expense);
  color: white;
}

.btn-sim {
  background: var(--primary);
  color: white;
}

.small-btn {
  width: 100%;
  margin-top: 12px;
  background: var(--primary);
  color: white;
}

/* =========================
   SIMULATOR
   ========================= */

.sim-result {
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  font-size: 0.9rem;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  color: #166534;
}

.sim-result.warning {
  background: #fef2f2;
  border-color: #fecaca;
  color: #991b1b;
}

/* =========================
   HISTORY
   ========================= */

.history-list {
  list-style: none;
  padding: 0;
  margin: 0;
  max-height: 500px;
  overflow-y: auto;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.history-item:last-child {
  border-bottom: none;
}

.amount-income {
  color: var(--income);
  font-weight: 600;
}

.amount-expense {
  color: var(--expense);
  font-weight: 600;
}

.transaction-actions {
  display: flex;
  gap: 5px;
  flex: none;
}

.edit-btn {
  background: #6b7280;
  color: white;
  padding: 7px 9px;
  font-size: 0.75rem;
}

.delete-btn {
  background: var(--expense);
  color: white;
  padding: 7px 9px;
  font-size: 0.75rem;
}

.sync-status {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 10px auto;
  font-size: 0.8rem;
  color: #6b7280;
  text-align: center;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 420px) {

  body {
    padding: 14px;
  }

  .period-grid {
    grid-template-columns: 1fr;
  }

  .history-item {
    align-items: flex-start;
  }

  .transaction-actions {
    flex-direction: column;
  }

}
</style>
</head>

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://dozrkzhthwhsiuoayevn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9cepCF9U1UsE1UBt0aMNmA_ivwc8AzV";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
   ===================================================== */

let transactions = [];

let periodStart =
  localStorage.getItem("periodStart");

let periodEnd =
  localStorage.getItem("periodEnd");


/* =====================================================
   MENU
   ===================================================== */

function toggleMenu() {

  const menu =
    document.getElementById("menu");

  menu.classList.toggle("open");

}


function showPage(page) {

  const dashboardPage =
    document.getElementById(
      "dashboardPage"
    );

  const historyPage =
    document.getElementById(
      "historyPage"
    );

  const dashboardMenu =
    document.getElementById(
      "dashboardMenu"
    );

  const historyMenu =
    document.getElementById(
      "historyMenu"
    );

  const pageTitle =
    document.getElementById(
      "pageTitle"
    );


  if (page === "dashboard") {

    dashboardPage.classList.add(
      "active"
    );

    historyPage.classList.remove(
      "active"
    );

    dashboardMenu.classList.add(
      "active"
    );

    historyMenu.classList.remove(
      "active"
    );

    pageTitle.innerText =
      "Dashboard";

  }


  if (page === "history") {

    dashboardPage.classList.remove(
      "active"
    );

    historyPage.classList.add(
      "active"
    );

    dashboardMenu.classList.remove(
      "active"
    );

    historyMenu.classList.add(
      "active"
    );

    pageTitle.innerText =
      "Transaction History";

  }


  document
    .getElementById("menu")
    .classList.remove("open");

}


/* =====================================================
   DATE HELPERS
   ===================================================== */

function formatDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;

}


function parseDate(value) {

  const parts =
    value.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}


function daysBetween(
  start,
  end
) {

  const startDate =
    parseDate(start);

  const endDate =
    parseDate(end);

  return Math.round(
    (
      endDate.getTime() -
      startDate.getTime()
    ) /
    (1000 * 60 * 60 * 24)
  );

}


/* =====================================================
   DEFAULT PERIOD
   ===================================================== */

function getDefaultPeriod() {

  const today =
    new Date();

  const year =
    today.getFullYear();

  const month =
    today.getMonth();

  let start;
  let end;


  if (
    today.getDate() >= 3
  ) {

    start =
      new Date(
        year,
        month,
        3
      );

    end =
      new Date(
        year,
        month + 1,
        3
      );

  } else {

    start =
      new Date(
        year,
        month - 1,
        3
      );

    end =
      new Date(
        year,
        month,
        3
      );

  }


  return {

    start:
      formatDate(start),

    end:
      formatDate(end)

  };

}


/* =====================================================
   LOAD PERIOD
   ===================================================== */

function loadPeriod() {

  if (
    !periodStart ||
    !periodEnd
  ) {

    const defaultPeriod =
      getDefaultPeriod();

    periodStart =
      defaultPeriod.start;

    periodEnd =
      defaultPeriod.end;

    localStorage.setItem(
      "periodStart",
      periodStart
    );

    localStorage.setItem(
      "periodEnd",
      periodEnd
    );

  }


  document.getElementById(
    "periodStart"
  ).value =
    periodStart;

  document.getElementById(
    "periodEnd"
  ).value =
    periodEnd;

}


/* =====================================================
   SAVE PERIOD
   ===================================================== */

function savePeriod() {

  const start =
    document.getElementById(
      "periodStart"
    ).value;

  const end =
    document.getElementById(
      "periodEnd"
    ).value;


  if (
    !start ||
    !end
  ) {

    alert(
      "Please select both dates."
    );

    return;

  }


  if (
    start >= end
  ) {

    alert(
      "End date must be after start date."
    );

    return;

  }


  periodStart =
    start;

  periodEnd =
    end;


  localStorage.setItem(
    "periodStart",
    periodStart
  );

  localStorage.setItem(
    "periodEnd",
    periodEnd
  );


  updateUI();


  alert(
    "Budget period saved."
  );

}


/* =====================================================
   FETCH TRANSACTIONS
   ===================================================== */

async function fetchCloudData() {

  const status =
    document.getElementById(
      "syncStatus"
    );


  status.innerText =
    "Syncing with Supabase...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("transactions")
        .select("*")
        .order(
          "date",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "SUPABASE LOAD ERROR:",
        error
      );

      status.innerText =
        "Supabase connection error";

      return;

    }


    transactions =
      data || [];


    status.innerText =
      "Connected to Supabase";


    updateUI();


  } catch (error) {

    console.error(error);

    status.innerText =
      "Failed to connect to Supabase";

  }

}


/* =====================================================
   ADD TRANSACTION
   ===================================================== */

async function addTransaction(type) {

  const noteInput =
    document.getElementById(
      "txNote"
    );

  const amountInput =
    document.getElementById(
      "txAmount"
    );


  const note =
    noteInput.value.trim() ||
    (
      type === "income"
        ? "Income"
        : "Expense"
    );


  const amount =
    parseFloat(
      amountInput.value
    );


  if (
    isNaN(amount) ||
    amount <= 0
  ) {

    alert(
      "Please enter a valid amount."
    );

    return;

  }


  const payload = {

    note: note,

    amount: amount,

    type: type,

    date:
      formatDate(
        new Date()
      )

  };


  const status =
    document.getElementById(
      "syncStatus"
    );


  status.innerText =
    "Saving transaction...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("transactions")
        .insert([payload])
        .select()
        .single();


    if (error) {

      console.error(
        "SUPABASE INSERT ERROR:",
        error
      );

      alert(
        "Supabase Error:\n\n" +
        error.message
      );

      status.innerText =
        "Error saving transaction";

      return;

    }


    transactions.unshift(
      data
    );


    updateUI();


    noteInput.value =
      "";

    amountInput.value =
      "";


    status.innerText =
      "Transaction saved!";


  } catch (error) {

    console.error(error);

    alert(
      "Could not save transaction."
    );

    status.innerText =
      "Error saving transaction";

  }

}


/* =====================================================
   EDIT TRANSACTION
   ===================================================== */

async function editTransaction(id) {

  const transaction =
    transactions.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!transaction)
    return;


  const newNote =
    prompt(
      "Description:",
      transaction.note
    );


  if (
    newNote === null
  )
    return;


  const newAmount =
    prompt(
      "Amount:",
      transaction.amount
    );


  if (
    newAmount === null
  )
    return;


  const amount =
    parseFloat(
      newAmount
    );


  if (
    isNaN(amount) ||
    amount <= 0
  ) {

    alert(
      "Invalid amount."
    );

    return;

  }


  const newType =
    prompt(
      "Type: income or expense",
      transaction.type
    );


  if (
    newType !== "income" &&
    newType !== "expense"
  ) {

    alert(
      "Type must be income or expense."
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("transactions")
      .update({

        note:
          newNote,

        amount:
          amount,

        type:
          newType

      })
      .eq(
        "id",
        id
      )
      .select()
      .single();


  if (error) {

    console.error(
      "SUPABASE UPDATE ERROR:",
      error
    );

    alert(
      "Could not update transaction:\n\n" +
      error.message
    );

    return;

  }


  const index =
    transactions.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );


  if (
    index !== -1
  ) {

    transactions[index] =
      data;

  }


  updateUI();

}


/* =====================================================
   DELETE TRANSACTION
   ===================================================== */

async function deleteTransaction(id) {

  const confirmed =
    confirm(
      "Delete this transaction?"
    );


  if (!confirmed)
    return;


  const {
    error
  } =
    await supabaseClient
      .from("transactions")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "SUPABASE DELETE ERROR:",
      error
    );

    alert(
      "Could not delete transaction:\n\n" +
      error.message
    );

    return;

  }


  transactions =
    transactions.filter(
      item =>
        String(item.id) !==
        String(id)
    );


  updateUI();

}


/* =====================================================
   BALANCE
   ===================================================== */

function calculateBalance(
  list
) {

  return list.reduce(
    (
      balance,
      item
    ) => {

      const amount =
        Number(
          item.amount
        ) || 0;


      if (
        item.type ===
        "income"
      ) {

        return balance +
          amount;

      }


      return balance -
        amount;

    },
    0
  );

}


/* =====================================================
   CURRENT PERIOD TRANSACTIONS
   ===================================================== */

function getCurrentPeriodTransactions() {

  if (
    !periodStart ||
    !periodEnd
  ) {

    return [];

  }


  return transactions.filter(
    item =>
      item.date >=
        periodStart &&
      item.date <
        periodEnd
  );

}


/* =====================================================
   PREVIOUS PERIOD
   ===================================================== */

function getPreviousPeriod() {

  const start =
    parseDate(
      periodStart
    );

  const duration =
    daysBetween(
      periodStart,
      periodEnd
    );


  const previousEnd =
    new Date(
      start
    );


  const previousStart =
    new Date(
      start
    );


  previousEnd.setDate(
    previousEnd.getDate() - 1
  );


  previousStart.setDate(
    previousStart.getDate() -
    duration
  );


  return {

    start:
      formatDate(
        previousStart
      ),

    end:
      formatDate(
        previousEnd
      )

  };

}


/* =====================================================
   LAST PERIOD SAVED
   ===================================================== */

function calculateLastMonthSaved() {

  const previous =
    getPreviousPeriod();


  const previousTransactions =
    transactions.filter(
      item =>
        item.date >=
          previous.start &&
        item.date <=
          previous.end
    );


  return calculateBalance(
    previousTransactions
  );

}


/* =====================================================
   UPDATE DASHBOARD
   ===================================================== */

function updateUI() {

  const currentTransactions =
    getCurrentPeriodTransactions();


  const currentBalance =
    calculateBalance(
      currentTransactions
    );


  const lastSaved =
    calculateLastMonthSaved();


  const today =
    formatDate(
      new Date()
    );


  let daysLeft = 0;


  if (
    today < periodEnd
  ) {

    if (
      today < periodStart
    ) {

      daysLeft =
        daysBetween(
          periodStart,
          periodEnd
        );

    } else {

      daysLeft =
        daysBetween(
          today,
          periodEnd
        );

    }

  }


  const carriedForward =
    Math.max(
      0,
      lastSaved
    );


  const availableMoney =
    currentBalance +
    carriedForward;


  const dailySpend =
    daysLeft > 0
      ? availableMoney /
        daysLeft
      : 0;


  document.getElementById(
    "totalBalance"
  ).innerText =
    `₹${availableMoney.toLocaleString()}`;


  document.getElementById(
    "daysLeft"
  ).innerText =
    `${daysLeft} days`;


  document.getElementById(
    "dailySpend"
  ).innerText =
    `₹${Math.max(
      0,
      dailySpend
    ).toFixed(2)} / day`;


  document.getElementById(
    "lastMonthSaved"
  ).innerText =
    `₹${lastSaved.toLocaleString()}`;


  document.getElementById(
    "carriedForward"
  ).innerText =
    `₹${carriedForward.toLocaleString()}`;


  renderHistory();

}


/* =====================================================
   TRANSACTION HISTORY
   ===================================================== */

function renderHistory() {

  const list =
    document.getElementById(
      "historyList"
    );


  list.innerHTML =
    "";


  if (
    transactions.length === 0
  ) {

    list.innerHTML = `

      <li style="
        text-align:center;
        color:#9ca3af;
        padding:20px;
      ">

        No transactions yet.

      </li>

    `;

    return;

  }


  transactions.forEach(
    item => {

      const li =
        document.createElement(
          "li"
        );


      li.className =
        "history-item";


      const sign =
        item.type ===
          "income"
          ? "+"
          : "-";


      const cssClass =
        item.type ===
          "income"
          ? "amount-income"
          : "amount-expense";


      li.innerHTML = `

        <div style="flex:1; min-width:0;">

          <div style="
            font-weight:500;
            word-break:break-word;
          ">
            ${escapeHtml(
              item.note || ""
            )}
          </div>

          <div style="
            font-size:0.75rem;
            color:#9ca3af;
            margin-top:3px;
          ">
            ${item.date}
          </div>

        </div>


        <div
          class="${cssClass}"
          style="white-space:nowrap;"
        >
          ${sign}₹${Number(
            item.amount
          ).toLocaleString()}
        </div>


        <div
          class="transaction-actions"
        >

          <button
            class="edit-btn"
            onclick="editTransaction('${item.id}')"
          >
            Edit
          </button>

          <button
            class="delete-btn"
            onclick="deleteTransaction('${item.id}')"
          >
            Delete
          </button>

        </div>

      `;


      list.appendChild(
        li
      );

    }
  );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* =====================================================
   AFFORDABILITY
   ===================================================== */

function checkAffordability() {

  const input =
    document.getElementById(
      "simAmount"
    );


  const result =
    document.getElementById(
      "simResult"
    );


  const cost =
    parseFloat(
      input.value
    );


  if (
    isNaN(cost) ||
    cost <= 0
  ) {

    alert(
      "Please enter a valid amount."
    );

    return;

  }


  const currentTransactions =
    getCurrentPeriodTransactions();


  const currentBalance =
    calculateBalance(
      currentTransactions
    );


  const lastSaved =
    calculateLastMonthSaved();


  const available =
    currentBalance +
    Math.max(
      0,
      lastSaved
    );


  const today =
    formatDate(
      new Date()
    );


  let daysLeft = 0;


  if (
    today < periodStart
  ) {

    daysLeft =
      daysBetween(
        periodStart,
        periodEnd
      );

  } else if (
    today < periodEnd
  ) {

    daysLeft =
      daysBetween(
        today,
        periodEnd
      );

  }


  const remaining =
    available -
    cost;


  result.style.display =
    "block";


  if (
    remaining < 0
  ) {

    result.className =
      "sim-result warning";


    result.innerHTML = `

      <strong>Over Budget!</strong><br>

      This purchase would put you
      ₹${Math.abs(
        remaining
      ).toLocaleString()}
      in deficit.

    `;

  } else {

    const newDaily =
      daysLeft > 0
        ? remaining /
          daysLeft
        : 0;


    result.className =
      "sim-result";


    result.innerHTML = `

      You can afford this!<br>

      After this purchase,
      your daily allowance would be

      <strong>
        ₹${newDaily.toFixed(2)} / day
      </strong>.

    `;

  }

}
